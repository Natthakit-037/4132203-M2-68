<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Notification App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <style>
        .glass-morphism {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass-morphism rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">FCM Notification</h1>
            <p class="text-slate-500 text-sm">รับการแจ้งเตือนแบบ Real-time จาก Firebase</p>
        </div>

        <!-- Status Card -->
        <div id="status-card" class="bg-white rounded-xl p-4 mb-6 border border-slate-200">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-slate-600">สถานะ Token:</span>
                <span id="token-status"
                    class="text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-700 font-semibold">รอดำเนินการ</span>
            </div>
            <textarea id="token-display" readonly
                class="w-full text-[10px] p-2 bg-slate-50 border border-slate-200 rounded h-20 break-all resize-none mb-3 font-mono"
                placeholder="Registration Token จะแสดงที่นี่..."></textarea>
            <button id="copy-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm py-2 rounded-lg transition-all duration-200 font-medium">
                คัดลอก Token
            </button>
        </div>

        <!-- Messages Area -->
        <div class="space-y-4">
            <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">ข้อความล่าสุด</h2>
            <div id="messages-list" class="space-y-3 max-h-48 overflow-y-auto pr-2">
                <div class="text-center text-slate-400 py-4 italic text-sm">ยังไม่มีข้อความใหม่...</div>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-200">
            <p class="text-[10px] text-slate-400 text-center uppercase tracking-widest">Powered by Firebase Cloud
                Messaging</p>
        </div>
    </div>

    <script>
        // 1. Firebase Configuration (ใส่ค่าของคุณที่นี่)
        const firebaseConfig = {
            apiKey: "AIzaSyDofeoJRi5bZt2R4foMhmHcSw1hF4CFHq0",
            authDomain: "natthakit-037.firebaseapp.com",
            projectId: "natthakit-037",
            storageBucket: "natthakit-037.firebasestorage.app",
            messagingSenderId: "909164279553",
            appId: "1:909164279553:web:ece0728140d4902f4e0d00"
        };

        // 2. Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        const tokenDisplay = document.getElementById('token-display');
        const tokenStatus = document.getElementById('token-status');
        const copyBtn = document.getElementById('copy-btn');
        const messagesList = document.getElementById('messages-list');

        // 3. Request Permission and Get Token
        function initFCM() {
            console.log('Requesting permission...');
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    console.log('Notification permission granted.');

                    // Get Token (VAPID Key is optional if configured in Firebase Console)
                    messaging.getToken({ vapidKey: 'BLC0E7vJ9NQqoW6DT26h8xnGoc0itcw8XSklkjd5iBPu8hxd7K5DKXdMmonHv2ErgjYir1bUq6-JfIcYQIsaryw' })
                        .then((currentToken) => {
                            if (currentToken) {
                                tokenDisplay.value = currentToken;
                                tokenStatus.innerText = 'เชื่อมต่อแล้ว';
                                tokenStatus.className = 'text-xs px-2 py-1 rounded-full bg-green-100 text-green-700 font-semibold';
                            } else {
                                console.log('No registration token available. Request permission to generate one.');
                                tokenStatus.innerText = 'ไม่พบ Token';
                            }
                        })
                        .catch((err) => {
                            console.log('An error occurred while retrieving token. ', err);
                            tokenStatus.innerText = 'เกิดข้อผิดพลาด';
                            tokenStatus.className = 'text-xs px-2 py-1 rounded-full bg-red-100 text-red-700 font-semibold';
                        });
                } else {
                    console.log('Unable to get permission to notify.');
                    tokenStatus.innerText = 'ถูกปฏิเสธสิทธิ์';
                    tokenStatus.className = 'text-xs px-2 py-1 rounded-full bg-red-100 text-red-700 font-semibold';
                }
            });
        }

        // 4. Handle Foreground Messages
        messaging.onMessage((payload) => {
            console.log('Message received. ', payload);

            // Clear empty message placeholder
            if (messagesList.querySelector('div.italic')) {
                messagesList.innerHTML = '';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'bg-white p-3 border-l-4 border-indigo-500 rounded shadow-sm animate-pulse';
            msgDiv.innerHTML = `
                <div class="font-bold text-sm text-slate-800">${payload.notification.title}</div>
                <div class="text-xs text-slate-600">${payload.notification.body}</div>
            `;
            messagesList.prepend(msgDiv);

            // Remove pulse animation after a while
            setTimeout(() => msgDiv.classList.remove('animate-pulse'), 2000);
        });

        // 5. Utility: Copy to Clipboard
        copyBtn.addEventListener('click', () => {
            if (!tokenDisplay.value) return;
            tokenDisplay.select();
            document.execCommand('copy');
            const originalText = copyBtn.innerText;
            copyBtn.innerText = 'คัดลอกสำเร็จ!';
            copyBtn.classList.replace('bg-indigo-600', 'bg-green-600');
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.classList.replace('bg-green-600', 'bg-indigo-600');
            }, 2000);
        });

        // Start initialization
        window.onload = () => {
            // Register Service Worker for Background messages
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./firebase-messaging-sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered with scope:', registration.scope);
                        messaging.useServiceWorker(registration);
                        initFCM();
                    }).catch((err) => {
                        console.log('Service Worker registration failed:', err);
                        // Fallback to direct init if in local environment without SW file
                        initFCM();
                    });
            }
        };
    </script>
</body>

</html>
